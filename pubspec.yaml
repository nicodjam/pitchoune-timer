name: pitchoune_timer
description: "A timer for children: each child spends their own time balance as an animated countdown."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  qr_flutter: ^4.1.0        # draws the family QR code
  mobile_scanner: ^7.4.2    # reads it with the camera

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
