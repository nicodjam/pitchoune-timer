<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><g transform="translate(143.4 130.4) scale(0.72)">
  <!-- side button of the stopwatch -->
  <g transform="rotate(62 512 600)">
    <rect x="477" y="306" width="70" height="70" rx="14" fill="#FFA62B" stroke="#2B2350" stroke-width="20"/>
  </g>
  <g transform="rotate(-62 512 600)">
    <rect x="477" y="306" width="70" height="70" rx="14" fill="#FFA62B" stroke="#2B2350" stroke-width="20"/>
  </g>
  <!-- stopwatch body -->
  <circle cx="512" cy="600" r="250" fill="#FFA62B" stroke="#2B2350" stroke-width="24"/>
  <circle cx="512" cy="600" r="200" fill="#FFFFFF"/>
  <!-- dial ticks -->
  <circle cx="512.0" cy="430.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="597.0" cy="452.8" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="659.2" cy="515.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="682.0" cy="600.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="659.2" cy="685.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="597.0" cy="747.2" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="512.0" cy="770.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="427.0" cy="747.2" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="364.8" cy="685.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="342.0" cy="600.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="364.8" cy="515.0" r="11" fill="#2B2350" fill-opacity="0.3"/><circle cx="427.0" cy="452.8" r="11" fill="#2B2350" fill-opacity="0.3"/>
  <!-- face, clipped to the dial -->
  <clipPath id="dial"><circle cx="512" cy="600" r="200"/></clipPath>
  <g clip-path="url(#dial)">
    <!-- eye patch strap -->
    <path d="M 300 470 L 740 655" stroke="#2B2350" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- cheeks -->
  <circle cx="400" cy="660" r="30" fill="#FF7EB3" fill-opacity="0.45"/>
  <circle cx="630" cy="670" r="30" fill="#FF7EB3" fill-opacity="0.45"/>
  <!-- open eye -->
  <circle cx="430" cy="565" r="46" fill="#FFFFFF" stroke="#2B2350" stroke-width="14"/>
  <circle cx="440" cy="558" r="22" fill="#2B2350"/>
  <circle cx="447" cy="550" r="7" fill="#FFFFFF"/>
  <!-- eye patch -->
  <ellipse cx="590" cy="585" rx="56" ry="46" fill="#2B2350" transform="rotate(22 590 585)"/>
  <!-- grin with a gold tooth -->
  <path d="M 432 668 Q 515 770 604 668 Q 515 700 432 668 Z" fill="#2B2350"/>
  <rect x="528" y="684" width="24" height="22" rx="4" fill="#FFC94D"/>
  <!-- tricorn hat -->
  <path d="M 222 415 C 290 250 420 195 512 212 C 604 195 734 250 802 415
           C 706 372 606 362 512 372 C 418 362 318 372 222 415 Z" fill="#2B2350"/>
  <path d="M 222 415 C 318 372 418 362 512 372 C 606 362 706 372 802 415"
        fill="none" stroke="#FFC94D" stroke-width="18" stroke-linecap="round"/>
  <!-- skull and crossbones -->
  <g fill="#FFFFFF">
    <g transform="rotate(35 512 300)">
      <rect x="452" y="290" width="120" height="20" rx="10"/>
      <circle cx="452" cy="292" r="12"/><circle cx="452" cy="308" r="12"/>
      <circle cx="572" cy="292" r="12"/><circle cx="572" cy="308" r="12"/>
    </g>
    <g transform="rotate(-35 512 300)">
      <rect x="452" y="290" width="120" height="20" rx="10"/>
      <circle cx="452" cy="292" r="12"/><circle cx="452" cy="308" r="12"/>
      <circle cx="572" cy="292" r="12"/><circle cx="572" cy="308" r="12"/>
    </g>
    <circle cx="512" cy="282" r="36"/>
    <rect x="490" y="296" width="44" height="26" rx="8"/>
  </g>
  <circle cx="499" cy="280" r="9" fill="#2B2350"/>
  <circle cx="525" cy="280" r="9" fill="#2B2350"/>
</g></svg>